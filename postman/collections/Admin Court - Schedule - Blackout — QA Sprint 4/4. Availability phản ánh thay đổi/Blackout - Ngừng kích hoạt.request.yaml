$kind: http-request
name: Blackout / Ngừng kích hoạt
url: "{{baseUrl}}/admin/courts/{{courtId}}/blackouts/{{blackoutId}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Xoa mem blackout 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 2000
