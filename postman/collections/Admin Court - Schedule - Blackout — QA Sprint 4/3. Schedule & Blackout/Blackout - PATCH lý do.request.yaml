$kind: http-request
name: Blackout / PATCH lý do
url: "{{baseUrl}}/admin/courts/{{courtId}}/blackouts/{{blackoutId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "reason": "QA S4 blackout updated"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Patch blackout 200', () => pm.response.to.have.status(200));
      pm.test('Ly do da doi', () => pm.expect(pm.response.json().data.reason).to.include('updated'));
    language: text/javascript
order: 5000
