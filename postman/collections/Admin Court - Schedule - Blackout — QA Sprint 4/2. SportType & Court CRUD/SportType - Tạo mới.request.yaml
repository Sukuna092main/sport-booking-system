$kind: http-request
name: SportType / Tạo mới
url: "{{baseUrl}}/admin/sport-types"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "QA S4 Sport {{runId}}",
      "description": "Tao boi collection #94",
      "isActive": true
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Tao sport type 201', () => pm.response.to.have.status(201));
      const b = pm.response.json();
      pm.collectionVariables.set('sportTypeId', b.data.id);
      pm.test('Tra ve id va isActive=true', () => {
        pm.expect(b.data.id).to.be.a('string').and.not.empty;
        pm.expect(b.data.isActive).to.eql(true);
      });
    language: text/javascript
order: 1000
