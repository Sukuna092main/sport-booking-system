$kind: http-request
name: Court / Tạo sân
url: "{{baseUrl}}/admin/courts"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "sportTypeId": "{{sportTypeId}}",
      "code": "QA-S4-{{runId}}",
      "name": "QA S4 Court {{runId}}",
      "isActive": true,
      "slotDurationMinutes": 60,
      "minConsecutiveSlots": 1,
      "maxConsecutiveSlots": 4,
      "referencePriceAmount": "100000",
      "referencePriceCurrency": "VND"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Tao court 201', () => pm.response.to.have.status(201));
      const b = pm.response.json();
      pm.collectionVariables.set('courtId', b.data.id);
      pm.test('Ap dung dung chinh sach slot', () => {
        pm.expect(b.data.slotDurationMinutes).to.eql(60);
        pm.expect(b.data.maxConsecutiveSlots).to.eql(4);
      });
    language: text/javascript
order: 3000
