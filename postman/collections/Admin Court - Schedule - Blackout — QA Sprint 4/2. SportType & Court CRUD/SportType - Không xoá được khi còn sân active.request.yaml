$kind: http-request
name: SportType / Không xoá được khi còn sân active
url: "{{baseUrl}}/admin/sport-types/{{sportTypeId}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Con san active thi phai 409', () => pm.response.to.have.status(409));
    language: text/javascript
order: 6000
