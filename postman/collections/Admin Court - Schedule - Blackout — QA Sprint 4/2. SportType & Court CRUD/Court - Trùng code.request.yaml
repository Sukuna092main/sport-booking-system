$kind: http-request
name: Court / Trùng code
url: "{{baseUrl}}/admin/courts"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "sportTypeId": "{{sportTypeId}}",
      "code": "QA-S4-{{runId}}",
      "name": "Trung code"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Trung code phai 409', () => pm.response.to.have.status(409));
    language: text/javascript
order: 4000
