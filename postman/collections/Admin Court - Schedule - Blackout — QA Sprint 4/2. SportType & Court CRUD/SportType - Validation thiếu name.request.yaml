$kind: http-request
name: SportType / Validation thiếu name
url: "{{baseUrl}}/admin/sport-types"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{}"
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Thieu name phai 400', () => pm.response.to.have.status(400));
      pm.test('error.code = validation_error', () => pm.expect(pm.response.json().error.code).to.eql('validation_error'));
    language: text/javascript
order: 2000
