$kind: http-request
name: Court / Ngừng kích hoạt sân
url: "{{baseUrl}}/admin/courts/{{courtId}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Xoa mem court 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 2000
