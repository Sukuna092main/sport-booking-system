$kind: http-request
name: S2 - Availability - No Schedule
url: http://localhost:8080/api/v1/courts/92000000-0000-4000-8000-000000000002/availability?date=2026-10-17
method: GET
queryParams:
  - key: date
    value: '2026-10-17'
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |
      // Sân Tennis hợp lệ nhưng chưa có operating_hours/time_slots: 200 với slots rỗng, không phải 404.
      pm.test("Trả HTTP 200 vì sân hợp lệ", () => {
        pm.response.to.have.status(200);
      });
      const body = pm.response.json();
      pm.test("Envelope availability đúng sân, ngày, múi giờ sân", () => {
        pm.expect(body.data.courtId).to.eql("92000000-0000-4000-8000-000000000002");
        pm.expect(body.data.date).to.eql("2026-10-17");
        pm.expect(body.data.timeZone).to.eql("Asia/Ho_Chi_Minh");
      });
      pm.test("Danh sách slot rỗng vì chưa có lịch/slot", () => {
        pm.expect(body.data.slots).to.be.an("array");
        pm.expect(body.data.slots).to.be.empty;
      });
    language: text/javascript
order: 4505400000000010
