$kind: http-request
name: S2 - Availability - Day Plus 31
url: http://localhost:8080/api/v1/courts/92000000-0000-4000-8000-000000000001/availability?date=2026-11-16
method: GET
queryParams:
  - key: date
    value: '2026-11-16'
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |
      // Vượt giới hạn: hôm nay (16/10/2026) + 31 ngày = 16/11/2026 → phải bị từ chối.
      pm.test("Trả HTTP 400 khi vượt 30 ngày lịch", () => {
        pm.response.to.have.status(400);
      });
      const body = pm.response.json();
      pm.test("Lỗi validation_error với chi tiết trường date", () => {
        pm.expect(body.error.code).to.eql("validation_error");
        pm.expect(body.error.details).to.be.an("array");
        pm.expect(body.error.details[0].field).to.eql("date");
      });
      pm.test("Thông báo nói rõ giới hạn 30 ngày lịch", () => {
        pm.expect(body.error.details[0].message).to.include("30 ngày lịch");
      });
    language: text/javascript
order: 4505400000000003
