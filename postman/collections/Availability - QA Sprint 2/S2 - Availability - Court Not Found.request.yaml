$kind: http-request
name: S2 - Availability - Court Not Found
url: http://localhost:8080/api/v1/courts/92000000-0000-4000-8000-000000000099/availability?date=2026-10-17
method: GET
queryParams:
  - key: date
    value: '2026-10-17'
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |
      // UUID đúng định dạng nhưng không tồn tại trong dữ liệu QA: 404, không phải 400/500.
      pm.test("Trả HTTP 404 cho UUID không tồn tại", () => {
        pm.response.to.have.status(404);
      });
      const body = pm.response.json();
      pm.test("Lỗi not_found theo envelope chung", () => {
        pm.expect(body.error.code).to.eql("not_found");
        pm.expect(body.error.message).to.include("Không tìm thấy sân đang hoạt động");
      });
      pm.test("Không trả dữ liệu availability", () => {
        pm.expect(body).to.not.have.property("data");
      });
    language: text/javascript
order: 4505400000000009
