scripts:
  - type: afterResponse
    code: |
      // Hai giá trị giống nhau vẫn là hai tham số date → phải bị từ chối.
      pm.test("Trả HTTP 400 dù hai giá trị ngày giống nhau", () => {
        pm.response.to.have.status(400);
      });
      const body = pm.response.json();
      pm.test("Lỗi validation_error với chi tiết trường date", () => {
        pm.expect(body.error.code).to.eql("validation_error");
        pm.expect(body.error.details[0].field).to.eql("date");
      });
      pm.test("Thông báo yêu cầu đúng một ngày YYYY-MM-DD", () => {
        pm.expect(body.error.details[0].message).to.include("một ngày");
      });
