$kind: http-request
name: S2 - Availability - Day Plus 30
url: http://localhost:8080/api/v1/courts/92000000-0000-4000-8000-000000000001/availability?date=2026-11-15
method: GET
queryParams:
  - key: date
    value: '2026-11-15'
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |
      // Ngày biên trên hợp lệ: hôm nay (16/10/2026) + 30 ngày = 15/11/2026.
      pm.test("Trả HTTP 200 đúng giới hạn 30 ngày", () => {
        pm.response.to.have.status(200);
      });
      const body = pm.response.json();
      pm.test("Envelope availability đúng sân, ngày, múi giờ sân", () => {
        pm.expect(body.data.courtId).to.eql("92000000-0000-4000-8000-000000000001");
        pm.expect(body.data.date).to.eql("2026-11-15");
        pm.expect(body.data.timeZone).to.eql("Asia/Ho_Chi_Minh");
      });
      pm.test("Có sáu slot theo dữ liệu nền hiện tại", () => {
        pm.expect(body.data.slots).to.be.an("array");
        pm.expect(body.data.slots).to.have.lengthOf(6);
      });
      pm.test("Không có booking/blackout ngày 15/11 nên sáu slot đều available", () => {
        // Nếu dataset về sau có booking/blackout ngày 15/11, đổi expected theo dữ liệu thực tế.
        body.data.slots.forEach(s => pm.expect(s.available, "Slot " + s.startsAt).to.be.true);
      });
      pm.test("Slots sắp xếp tăng dần, mỗi slot kéo dài 60 phút", () => {
        const starts = body.data.slots.map(s => new Date(s.startsAt).getTime());
        pm.expect(starts).to.eql([...starts].sort((a, b) => a - b));
        body.data.slots.forEach(s => pm.expect(new Date(s.endsAt) - new Date(s.startsAt)).to.eql(3600000));
      });
    language: text/javascript
order: 4505400000000002
