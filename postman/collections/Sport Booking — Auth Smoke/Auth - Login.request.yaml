$kind: http-request
name: Auth / Login
url: http://localhost:8080/api/v1/auth/login
method: POST
body:
  type: json
  content: "{\r

    \  \"email\": \"{{userEmail}}\",\r

    \  \"password\": \"{{userPassword}}\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Đăng nhập trả HTTP 200\", () => {\r

      \  pm.response.to.have.status(200);\r

      });\r

      \r

      const body = pm.response.json();\r

      \r

      pm.test(\"Trả Bearer token và đúng user\", () => {\r

      \  pm.expect(body.data.tokenType).to.eql(\"Bearer\");\r

      \  pm.expect(body.data.accessToken).to.be.a(\"string\").and.not.empty;\r

      \  pm.expect(body.data.user.email).to.eql(pm.environment.get(\"userEmail\"));\r

      });\r

      \r

      if (pm.response.code === 200 && body.data?.accessToken) {\r

      \  pm.environment.set(\"userToken\", body.data.accessToken);\r

      }"
    language: text/javascript
order: 3666634202735553
