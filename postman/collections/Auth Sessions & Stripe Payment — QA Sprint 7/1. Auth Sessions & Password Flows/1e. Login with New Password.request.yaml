$kind: http-request
name: 1e. Login with New Password
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{testEmail}}",
      "password": "{{newPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('1e: Login with new password returns 200', () => pm.response.to.have.status(200));
      const res = pm.response.json();
      pm.collectionVariables.set('userToken', res.data.accessToken);
    language: text/javascript
order: 5000
