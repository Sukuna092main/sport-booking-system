$kind: http-request
name: 1d. Change Password
url: "{{baseUrl}}/auth/change-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "{{testPassword}}",
      "newPassword": "{{newPassword}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{userToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('1d: Change password returns 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
