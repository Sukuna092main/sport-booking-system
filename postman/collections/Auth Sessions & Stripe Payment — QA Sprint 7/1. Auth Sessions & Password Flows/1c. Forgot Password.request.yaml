$kind: http-request
name: 1c. Forgot Password
url: "{{baseUrl}}/auth/forgot-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{testEmail}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('1c: Forgot password returns 202', () => pm.response.to.have.status(202));
    language: text/javascript
order: 3000
