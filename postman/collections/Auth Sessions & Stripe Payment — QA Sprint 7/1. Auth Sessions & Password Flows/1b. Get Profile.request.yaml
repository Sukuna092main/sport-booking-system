$kind: http-request
name: 1b. Get Profile
url: "{{baseUrl}}/users/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{userToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('1b: GET /users/me returns 200', () => pm.response.to.have.status(200));
      const res = pm.response.json();
      pm.test('1b: Email matches', () => pm.expect(res.data.email).to.eql(pm.collectionVariables.get('testEmail')));
    language: text/javascript
order: 2000
