$kind: http-request
name: 2c. Public Get Court Pricing
url: "{{baseUrl}}/courts/{{courtId}}/pricing"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('2c: Get pricing returns 200', () => pm.response.to.have.status(200));
      const res = pm.response.json();
      pm.test('2c: Public price matches 50000', () => pm.expect(res.data.pricePerSlotVnd).to.eql(50000));
    language: text/javascript
order: 3000
