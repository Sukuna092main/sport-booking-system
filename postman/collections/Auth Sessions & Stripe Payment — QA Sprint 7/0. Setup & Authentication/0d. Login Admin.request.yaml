$kind: http-request
name: 0d. Login Admin
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{adminEmail}}",
      "password": "{{adminPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('0d: Admin login returns 200', () => pm.response.to.have.status(200));
      const res = pm.response.json();
      pm.collectionVariables.set('adminToken', res.data.accessToken);
      pm.test('0d: Role is ADMIN', () => pm.expect(res.data.user.role).to.eql('ADMIN'));
    language: text/javascript
order: 4000
