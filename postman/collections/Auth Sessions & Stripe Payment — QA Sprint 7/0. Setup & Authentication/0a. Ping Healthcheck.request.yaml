$kind: http-request
name: 0a. Ping Healthcheck
url: "{{baseUrl}}/ping"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('0a: Ping returns 200', () => pm.response.to.have.status(200));
      const res = pm.response.json();
      pm.test('0a: Status is ok', () => pm.expect(res.status).to.eql('ok'));
    language: text/javascript
order: 1000
