server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — mọi deep link (/courts, /admin/courts, ...) đều trả index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Asset có hash trong tên -> cache dài hạn
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html không được cache để luôn lấy bundle mới
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
